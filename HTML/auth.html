<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Access | Viduthalai</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../CSS/auth.css"
    >

</head>


<body>

    <main class="auth-page">

        <!-- BACKGROUND -->

        <div class="auth-background"></div>

        <div class="auth-overlay"></div>


        <!-- AUTH CARD -->

        <section class="auth-card">

            <!-- LOGO -->

            <div class="auth-logo">
                <span class="logo-mark">◆</span>
                <span>VIDUTHALAI</span>
            </div>


            <!-- TITLE -->

            <div class="auth-heading">

                <span class="eyebrow">
                    THE STORY OF FREEDOM
                </span>

                <h1 id="authTitle">
                    Welcome back.
                </h1>

                <p id="authSubtitle">
                    Enter your details to continue your journey.
                </p>

            </div>


            <!-- SWITCH -->

            <div class="auth-switch">

                <button
                    type="button"
                    class="switch-btn active"
                    id="loginTab"
                >
                    LOGIN
                </button>

                <button
                    type="button"
                    class="switch-btn"
                    id="signupTab"
                >
                    SIGN UP
                </button>

            </div>


            <!-- LOGIN FORM -->

            <form
                id="loginForm"
                class="auth-form"
            >

                <div class="field">

                    <label for="loginEmail">
                        EMAIL
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="loginPassword">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    <span>ENTER VIDUTHALAI</span>
                    <span>→</span>
                </button>

            </form>


            <!-- SIGNUP FORM -->

            <form
                id="signupForm"
                class="auth-form hidden"
            >

                <div class="field">

                    <label for="signupName">
                        FULL NAME
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="field">

                    <label for="signupEmail">
                        EMAIL
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="signupPassword">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="field">

                    <label for="signupConfirm">
                        CONFIRM PASSWORD
                    </label>

                    <input
                        type="password"
                        id="signupConfirm"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    <span>CREATE ACCOUNT</span>
                    <span>→</span>
                </button>

            </form>


            <!-- MESSAGE -->

            <div
                id="authMessage"
                class="auth-message"
            ></div>


            <!-- HOME -->

            <a
                href="home.html"
                class="back-home"
            >
                ← BACK TO HOME
            </a>

        </section>

    </main>


    <script src="../JAVASCRIPT/auth.js"></script>

</body>

</html>
